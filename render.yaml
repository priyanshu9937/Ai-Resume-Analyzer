services:
  - type: web
    name: ai-resume-analyzer
    runtime: python
    plan: 0.5c-512mb
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: resume-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: API_ACCESS_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: resume-analyzer-db
          property: connectionString

databases:
  - name: resume-analyzer-db
    databaseName: resume_analyzer
    user: resume_analyzer
    region: oregon
    plan: 0.1c-256mb
    ipAllowList: []